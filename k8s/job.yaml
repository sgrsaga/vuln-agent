# One-shot remediation Job.
# Trigger manually:
#   kubectl -n security create job vuln-remediate-dex \
#     --from=cronjob/vuln-agent-scan   # if using the CronJob template
#
# Or apply this file directly (edit TARGET_IMAGE first):
#   kubectl apply -f k8s/job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: vuln-remediate-dex          # change per image being scanned
  namespace: security
  labels:
    app: vuln-agent
spec:
  # Clean up finished pods automatically after 24 h
  ttlSecondsAfterFinished: 86400
  # Retry once on transient failures (build timeout, network blip)
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: vuln-agent
    spec:
      restartPolicy: Never
      securityContext:
        fsGroup: 999   # matches the "agent" GID in the container image (PVC write access)

      # Pull the vuln-agent image from GHCR
      imagePullSecrets:
        - name: ghcr-credentials

      # ── Init container: pre-warm Trivy DB from cache ──────────────────────
      # Omit this block if you prefer Trivy to always download fresh.
      initContainers:
        - name: trivy-db-update
          image: aquasec/trivy:latest
          args: ["image", "--download-db-only", "--cache-dir", "/trivy-cache"]
          volumeMounts:
            - name: trivy-cache
              mountPath: /trivy-cache

      containers:
        - name: vuln-agent
          image: ghcr.io/sgrsaga/vuln-agent:latest   # ← your built image
          imagePullPolicy: Always

          # ── Target image ────────────────────────────────────────────────────
          args: ["ghcr.io/dexidp/dex:v2.45.1"]       # ← override per job

          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vuln-agent-secrets
                  key: anthropic-api-key

            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vuln-agent-secrets
                  key: github-token

            - name: GITHUB_REPO
              value: "sgrsaga/vuln-agent"

            - name: GHCR_NAMESPACE
              value: "ghcr.io/sgrsaga"

            # ── External-scope tuning ─────────────────────────────────────────
            - name: MAX_ITERATIONS
              value: "5"
            # Allow the tag-bump check to cross a major upstream version.
            - name: ALLOW_MAJOR_TAG_BUMP
              value: "false"
            # Keep patched EXTERNAL images as <tag>-optimized-ext (team decision).
            - name: KEEP_EXTERNAL_IMAGES
              value: "true"

            # ── Internal-scope (owned image) opt-in ───────────────────────────
            # Single-image mode has no pod labels to select on — set
            # HARDEN_BASE_IMAGE=true AND give the image a HARDENING_CONFIG entry
            # to run the rebuild-from-source pipeline instead of the external one.
            - name: HARDEN_BASE_IMAGE
              value: "false"
            - name: HARDENING_CONFIG
              value: "[]"            # e.g. [{"repo":"myapp","sourceRepo":"myorg/myapp","dockerfilePath":"Dockerfile","testStage":"test"}]
            - name: HARDENING_MAX_CANDIDATES
              value: "3"
            - name: DEP_UPGRADE_MAX_ITERATIONS
              value: "5"
            - name: LLM_BASE_MAX_ROUNDS
              value: "5"
            - name: INTERNAL_MAX_ATTEMPTS
              value: "20"

            # ── Reports repo — human-readable system of record ────────────────
            # Commits each summary report (dated + stable latest.md) so
            # developers can browse/diff them. Empty repo disables.
            - name: REPORTS_REPO
              value: ""              # e.g. "myorg/security-reports"
            - name: REPORTS_BRANCH
              value: "main"
            # REPORTS_TOKEN falls back to GITHUB_TOKEN when unset.
            # File code-fix suggestions as issues on the app's source repo
            # when a balanced pick is non-deployable.
            - name: CODE_FIX_ISSUES
              value: "true"

            # ── GitOps promotion PR-bot (PPE/Prod) — empty repo disables ──────
            - name: GITOPS_REPO
              value: ""              # e.g. "myorg/gitops-ppe"
            - name: GITOPS_BASE_BRANCH
              value: "main"
            - name: GITOPS_IMAGE_PATH_TEMPLATE
              value: ""              # e.g. "environments/ppe/{repo_name}/values.yaml"
            # GITOPS_TOKEN falls back to GITHUB_TOKEN when unset.

            - name: OUTPUT_DIR
              value: "/app/output"

            - name: TRIVY_CACHE_DIR
              value: "/trivy-cache"

          volumeMounts:
            # Docker socket — needed for `docker build` and `docker push`.
            # Security note: this grants root-equivalent host access.
            # For production, replace with a Kaniko sidecar (see kaniko-job.yaml).
            - name: docker-socket
              mountPath: /var/run/docker.sock

            # Docker auth config so `docker push` can reach GHCR
            - name: docker-config
              mountPath: /home/agent/.docker
              readOnly: true

            # Output artifacts (scan JSON, reports, Dockerfiles)
            - name: output
              mountPath: /app/output

            # Trivy vulnerability DB cache (avoids re-downloading on each run)
            - name: trivy-cache
              mountPath: /trivy-cache

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"

      volumes:
        - name: docker-socket
          hostPath:
            path: /var/run/docker.sock
            type: Socket

        # Mount the GHCR dockerconfigjson secret as ~/.docker/config.json
        - name: docker-config
          secret:
            secretName: ghcr-credentials
            items:
              - key: .dockerconfigjson
                path: config.json

        - name: output
          persistentVolumeClaim:
            claimName: vuln-agent-output

        - name: trivy-cache
          persistentVolumeClaim:
            claimName: vuln-agent-trivy-cache
