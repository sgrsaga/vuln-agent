# ── API key secrets ──────────────────────────────────────────────────────────
# Fill in real values, then apply:
#   kubectl apply -f k8s/secrets.yaml
#
# Or create directly (avoids storing secrets in git):
#   kubectl -n security create secret generic vuln-agent-secrets \
#     --from-literal=anthropic-api-key=sk-ant-... \
#     --from-literal=github-token=ghp_...
#
# The GITHUB_TOKEN only needs repo:write + packages:write scopes.
apiVersion: v1
kind: Secret
metadata:
  name: vuln-agent-secrets
  namespace: security
type: Opaque
stringData:
  anthropic-api-key: "REPLACE_ME"
  github-token: "REPLACE_ME"

---
# ── GHCR pull / push credentials ─────────────────────────────────────────────
# Create a base64-encoded dockerconfigjson for ghcr.io, then put it here.
#
# Quick way to generate it:
#   echo -n "ghcr.io" | docker login --username YOUR_GH_USERNAME --password-stdin
#   cat ~/.docker/config.json | base64 -w0
#
# Or let kubectl do it:
#   kubectl -n security create secret docker-registry ghcr-credentials \
#     --docker-server=ghcr.io \
#     --docker-username=YOUR_GH_USERNAME \
#     --docker-password=YOUR_PAT_WITH_PACKAGES_WRITE
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-credentials
  namespace: security
type: kubernetes.io/dockerconfigjson
data:
  # base64( {"auths":{"ghcr.io":{"username":"...","password":"...","auth":"base64(user:pass)"}}} )
  .dockerconfigjson: "REPLACE_ME_WITH_BASE64_DOCKERCONFIG"
