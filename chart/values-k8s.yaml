image:
  repository: ghcr.io/sgrsaga/vuln-agent
  tag: latest
  pullPolicy: Always

# Credentials are managed via SealedSecrets (chart/sealed-secrets.yaml).
# Apply them before deploying:
#   kubectl apply -f chart/sealed-secrets.yaml
anthropic:
  existingSecret: "vuln-agent-secrets"
  existingSecretKey: "anthropic-api-key"

github:
  existingSecret: "vuln-agent-secrets"
  existingSecretKey: "github-token"
  repo: "sgrsaga/vuln-agent"

registry:
  namespace: "ghcr.io/sgrsaga"
  server: "ghcr.io"
  existingSecret: "vuln-agent-registry"

discovery:
  targetNamespaces:
    - argocd
    - monitoring
  excludedNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease
  includeInitContainers: false

scan:
  maxIterations: 3

# Run every day at 02:00 UTC (or trigger manually via kubectl create job)
schedule: "0 2 * * *"
timeZone: "UTC"
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3

persistence:
  output:
    size: 10Gi
    storageClass: "harvester"
    accessMode: ReadWriteOnce
  trivyCache:
    size: 5Gi
    storageClass: "harvester"
    accessMode: ReadWriteOnce

resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "4"
    memory: "4Gi"

serviceAccount:
  create: true

rbac:
  create: true
