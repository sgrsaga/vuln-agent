# SealedSecrets for vuln-agent — encrypted with the cluster's sealed-secrets controller.
# Decrypted automatically by the controller when applied to the vuln-agent namespace.
#
# Regenerate with:
#   kubeseal --fetch-cert \
#     --controller-namespace sealed-secrets --controller-name sealed-secrets \
#     > /tmp/sealing-cert.pem
#
#   echo -n "<value>" | kubeseal --raw --from-file=/dev/stdin \
#     --namespace vuln-agent --name <secret-name> \
#     --cert /tmp/sealing-cert.pem
#
# Apply before deploying the Helm chart:
#   kubectl apply -f chart/sealed-secrets.yaml
---
# Opaque secret: Anthropic API key + GitHub PAT
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vuln-agent-secrets
  namespace: vuln-agent
spec:
  encryptedData:
    anthropic-api-key: 
    github-token: 
  template:
    metadata:
      name: vuln-agent-secrets
      namespace: vuln-agent
    type: Opaque
---
# docker-registry secret: GHCR credentials for pulling ghcr.io/sgrsaga/vuln-agent
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: vuln-agent-registry
  namespace: vuln-agent
spec:
  encryptedData:
    .dockerconfigjson: 
  template:
    metadata:
      name: vuln-agent-registry
      namespace: vuln-agent
    type: kubernetes.io/dockerconfigjson
