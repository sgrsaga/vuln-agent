# ── Agent container image ──────────────────────────────────────────────────
image:
  repository: ghcr.io/sgrsaga/vuln-agent
  tag: ""
  digest: "sha256:1cfc906c15c0e0edf5276f8720413e986d3a1618eaebdb516f94fe6020f870c4"
  pullPolicy: IfNotPresent

# ── Anthropic API credentials ─────────────────────────────────────────────
# Credentials are managed via SealedSecrets (chart/sealed-secrets.yaml).
# Apply them before deploying:
#   kubectl apply -f chart/sealed-secrets.yaml
anthropic:
  apiKey: ""
  existingSecret: "vuln-agent-secrets"
  existingSecretKey: "anthropic-api-key"

# ── GitHub credentials ────────────────────────────────────────────────────
# Used for: pushing images to GHCR + creating GitHub Releases with artifacts.
# Required scopes: repo + write:packages
github:
  token: ""
  existingSecret: "vuln-agent-secrets"
  existingSecretKey: "github-token"
  repo: "sgrsaga/vuln-agent"

# ── Reports repo — human-readable system of record ────────────────────────
# When set, every summary report is ALSO committed to this repo
# (reports/<repo>/<tag>/<date>-summary.md + stable latest.md, and
# reports/run-summary/ for discovery runs) so developers can browse rendered
# markdown, diff runs over time, and deep-link fixed paths. Release assets
# remain the immutable audit archive. Empty repo disables.
reports:
  repo: "sgrsaga/reports"         # e.g. "myorg/security-reports"
  branch: "main"
  token: ""                       # falls back to github.token if unset
  existingSecret: "github-token"
  existingSecretKey: "reports-token"
  # Non-deployable balanced picks: file the adjudication's code-fix
  # suggestions as a GitHub Issue on the app's own source repo.
  codeFixIssues: true

# ── GitOps promotion PR-bot (higher environments — PPE/Prod) ──────────────
# Opens a reviewable PR against a separate GitOps manifests repo bumping the
# optimized image reference. Leave repo empty to disable — lower environments
# should use ArgoCD Image Updater instead (see README, no config here).
gitops:
  repo: "sgrsaga/reports"         # owner/repo of the GitOps manifests repo
  token: ""                       # falls back to github.token if unset
  existingSecret: "github-token"
  existingSecretKey: "gitops-token"
  baseBranch: "main"
  imagePathTemplate: ""           # e.g. "environments/ppe/{repo_name}/values.yaml"

# ── Private registry for patched images ───────────────────────────────────
registry:
  namespace: "ghcr.io/sgrsaga"
  server: "ghcr.io"
  username: ""
  password: ""
  # Keep patched EXTERNAL (third-party) images as <tag>-optimized-ext?
  # Keeping copies of third-party images is generally discouraged (upstream
  # ships the real fix eventually) but it's the team's call — default true.
  # Internal images (-golden-base-app / -optimized-app, plus the standalone
  # -golden-base / -optimized-base artifacts) are always kept regardless.
  keepExternalImages: true
  existingSecret: "vuln-agent-registry"

# ── Image discovery ────────────────────────────────────────────────────────
discovery:
  # TARGET NAMESPACES (whitelist — recommended for developer environments)
  # When set, ONLY these namespaces are scanned.
  # The agent's release namespace is never included even if listed here.
  # Leave empty ([]) to fall back to the excludedNamespaces blacklist.
  targetNamespaces:
    - monitoring
    - apps

  # EXCLUDED NAMESPACES (blacklist — used only when targetNamespaces is empty)
  # The agent's own release namespace is always appended automatically.
  excludedNamespaces:
    - kube-system
    - kube-public
    - kube-node-lease

  includeInitContainers: false

  # OWNED IMAGE LABEL SELECTOR — a standard k8s label selector (kubectl -l syntax)
  # identifying pods/deployments the org owns and can test, e.g.
  # "vuln-agent.io/harden=true". App teams self-service by labeling their own
  # workloads. Leave empty to disable base-image hardening entirely — it is
  # NEVER attempted for images that don't match this selector (see hardening
  # block below), since hardening rebuilds from source and needs the app's own
  # tests to have any confidence the rebuild didn't break it.
  ownedImageLabelSelector: "vuln-agent.io/harden=true"   # matches target-apps/k8s deployments

# ── Scan configuration ─────────────────────────────────────────────────────
scan:
  maxIterations: 3
  # Discovery mode only: rescan an image again after this many days even if
  # its digest hasn't changed, so unchanged workloads still get rechecked
  # against newly-disclosed CVEs. State is tracked on the output PVC.
  rescanIntervalDays: 7
  # Allow the base-image tag-bump check (agent/tag_finder.py) to cross a major
  # version when hunting for an upstream tag that already fixes CVEs. Off by
  # default — a major bump can change app behavior, so crossing one shouldn't
  # happen silently in an automated remediation loop.
  allowMajorTagBump: false
  # Internal images: max dependency-upgrade rebuild/test/rescan passes after
  # the base-image ladder.
  depUpgradeMaxIterations: 5
  # Internal images: max LLM base-determination rounds (outer ladder loop).
  llmBaseMaxRounds: 5
  # Internal images: global cap on build/test/rescan cycles per image — the
  # nested loops above are individually bounded, this bounds their product.
  internalMaxAttempts: 20

# ── Base image hardening ("golden image" generation) ───────────────────────
# Only ever attempted for images matching discovery.ownedImageLabelSelector
# above. Each entry below maps a bare image repo name to where its source/tests
# live — but this central list is optional: an app can instead self-service via
# vuln-agent.io/source-repo, vuln-agent.io/dockerfile-path, and
# vuln-agent.io/test-stage (or vuln-agent.io/test-command) annotations on its
# own Deployment, no entry here required at all. Annotations win field-by-field
# over a matching entry below when both are present. Claude suggests candidate
# replacement base images; each candidate is only adopted if the app's real
# Dockerfile test stage (or testCommand) passes AND the rebuilt image has fewer
# vulnerabilities than before. See target-apps/ for complete working examples.
hardening:
  maxCandidates: 3
  images: []
  # - repo: myapp                    # bare image repo name (no registry/tag)
  #   sourceRepo: myorg/myapp        # owner/repo to clone
  #   dockerfilePath: Dockerfile     # relative to the clone root; its directory is the
  #                                  # build context, so a monorepo subdir (myapp/Dockerfile) works
  #   # Only the base of the stage that becomes the FINAL built image gets
  #   # swapped (a plain `docker build` output — a builder stage's own base,
  #   # e.g. golang/node, is never touched, since it's discarded before the
  #   # image ships). testStage MUST share lineage with that final stage
  #   # (e.g. `FROM runtime AS test`) — otherwise a passing test run doesn't
  #   # actually validate the swapped base. See README's hardening section.
  #   testStage: test                 # preferred: `docker build --target test` is the pass/fail signal
  #   # testCommand: "pytest"         # fallback: `docker run --rm --network none <image> <cmd>`

# ── CronJob schedule ───────────────────────────────────────────────────────
# Run every day at 02:00 UTC (or trigger manually via kubectl create job)
schedule: "0 2 * * *"
timeZone: "UTC"
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
concurrencyPolicy: Forbid

# ── Persistent storage ─────────────────────────────────────────────────────
persistence:
  output:
    size: 10Gi
    storageClass: "harvester"
    accessMode: ReadWriteOnce
  trivyCache:
    size: 5Gi
    storageClass: "harvester"
    accessMode: ReadWriteOnce

# ── Resource limits ────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "500m"
    memory: "512Mi"
  limits:
    cpu: "4"
    memory: "4Gi"

# ── Service account ────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── RBAC ──────────────────────────────────────────────────────────────────
rbac:
  create: true

# ── Docker (optional — required only for building patched images) ──────────
# When Docker is unavailable (e.g. k8s pod without socket access), the agent
# runs in analysis-only mode: it scans, classifies, and generates Dockerfiles
# but skips the build+push step.
docker:
  # Set to the host Docker socket path to enable building in k8s (optional).
  # Leave empty to run in analysis-only mode (safe default for most clusters).
  hostSocketPath: ""

# ── Trivy init container ───────────────────────────────────────────────────
trivy:
  image: "aquasec/trivy:v0.73.0"

# ── Pod-level settings ─────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# Extra environment variables injected into the agent container
extraEnv: []
# - name: HTTP_PROXY
#   value: "http://proxy.example.com:3128"
