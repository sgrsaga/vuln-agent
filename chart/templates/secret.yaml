{{- if or (and (not .Values.anthropic.existingSecret) .Values.anthropic.apiKey) (and (not .Values.github.existingSecret) .Values.github.token) (and (not .Values.gitops.existingSecret) .Values.gitops.token) }}
---
# Opaque secret for API keys supplied inline.
# Each credential is included only when its own existingSecret is not set.
# To use an existing secret instead, set:
#   anthropic.existingSecret=my-secret  anthropic.existingSecretKey=api-key
#   github.existingSecret=my-secret     github.existingSecretKey=token
#   gitops.existingSecret=my-secret     gitops.existingSecretKey=token
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vuln-agent.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vuln-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and (not .Values.anthropic.existingSecret) .Values.anthropic.apiKey }}
  anthropic-api-key: {{ .Values.anthropic.apiKey | quote }}
  {{- end }}
  {{- if and (not .Values.github.existingSecret) .Values.github.token }}
  github-token: {{ .Values.github.token | quote }}
  {{- end }}
  {{- if and (not .Values.gitops.existingSecret) .Values.gitops.token }}
  gitops-token: {{ .Values.gitops.token | quote }}
  {{- end }}
{{- end }}

{{- if and (not .Values.registry.existingSecret) .Values.registry.username .Values.registry.password }}
---
# docker-registry secret used to push patched images to the private registry.
# Mounted as ~/.docker/config.json inside the agent pod.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-registry" (include "vuln-agent.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vuln-agent.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ printf `{"auths":{"%s":{"username":"%s","password":"%s","auth":"%s"}}}` .Values.registry.server .Values.registry.username .Values.registry.password (printf "%s:%s" .Values.registry.username .Values.registry.password | b64enc) | b64enc }}
{{- end }}
