apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "vuln-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vuln-agent.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}

  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "vuln-agent.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "vuln-agent.serviceAccountName" . }}

          imagePullSecrets:
            - name: {{ include "vuln-agent.registrySecretName" . }}

          # ── Init container: refresh Trivy vulnerability DB ────────────────
          initContainers:
            - name: trivy-db-update
              image: aquasec/trivy:latest
              args: ["image", "--download-db-only", "--cache-dir", "/trivy-cache"]
              volumeMounts:
                - name: trivy-cache
                  mountPath: /trivy-cache

          containers:
            - name: vuln-agent
              image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}

              # Discovery mode — whitelist if targetNamespaces is set.
              args:
                - "--discover"
                {{- with include "vuln-agent.targetNamespaces" . }}
                {{- if . }}
                - "--namespaces"
                - {{ . | quote }}
                {{- end }}
                {{- end }}

              # ── Config from ConfigMap ─────────────────────────────────────
              envFrom:
                - configMapRef:
                    name: {{ include "vuln-agent.fullname" . }}

              # ── API keys from Secret ──────────────────────────────────────
              env:
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.anthropic.existingSecret | default (include "vuln-agent.secretName" .) }}
                      key: {{ .Values.anthropic.existingSecretKey }}

                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.github.existingSecret | default (include "vuln-agent.secretName" .) }}
                      key: {{ .Values.github.existingSecretKey }}

                {{- with .Values.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}

              # ── Volume mounts ─────────────────────────────────────────────
              volumeMounts:
                # Scan results, reports, patch Dockerfiles
                - name: output
                  mountPath: /app/output

                # Trivy vulnerability DB cache
                - name: trivy-cache
                  mountPath: /trivy-cache

              resources:
                {{- toYaml .Values.resources | nindent 16 }}

          # ── Volumes ───────────────────────────────────────────────────────
          volumes:
            - name: output
              persistentVolumeClaim:
                claimName: {{ printf "%s-output" (include "vuln-agent.fullname" .) }}

            - name: trivy-cache
              persistentVolumeClaim:
                claimName: {{ printf "%s-trivy-cache" (include "vuln-agent.fullname" .) }}

          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
