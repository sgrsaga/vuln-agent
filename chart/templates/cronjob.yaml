apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "vuln-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vuln-agent.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}

  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "vuln-agent.selectorLabels" . | nindent 12 }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "vuln-agent.serviceAccountName" . }}
          securityContext:
            fsGroup: 999   # matches the "agent" GID in the container image

          imagePullSecrets:
            - name: {{ include "vuln-agent.registrySecretName" . }}

          # ── Init container: refresh Trivy vulnerability DB ────────────────
          initContainers:
            - name: trivy-db-update
              image: {{ .Values.trivy.image }}
              args: ["image", "--download-db-only", "--cache-dir", "/trivy-cache"]
              volumeMounts:
                - name: trivy-cache
                  mountPath: /trivy-cache

            {{- if .Values.docker.dind.enabled }}
            # ── Docker-in-Docker NATIVE SIDECAR (restartPolicy: Always) ─────
            # Portable build support for containerd clusters (no Docker on the
            # nodes, no hostPath). Runs dockerd inside the pod; the agent's
            # docker CLI and Trivy reach it over the default unix socket on
            # the shared /var/run emptyDir. A native sidecar (k8s >= 1.28)
            # terminates automatically when the main container finishes, so
            # the CronJob's Job still completes. Trade-offs: privileged: true
            # (daemon needs it), and the layer cache resets every run
            # (docker-graph is an emptyDir).
            - name: dind
              image: {{ .Values.docker.dind.image }}
              restartPolicy: Always
              securityContext:
                privileged: true
              # --group=0: own the socket with gid 0 — the agent container runs
              # as the non-root "agent" user whose supplementary groups include
              # root(0), while dind's default "docker" group gid exists only
              # inside the dind image and would leave the socket unreadable.
              args: ["--group=0"]
              env:
                - name: DOCKER_TLS_CERTDIR
                  value: ""          # unix socket only — no TCP, no TLS bootstrap
              volumeMounts:
                - name: docker-run
                  mountPath: /var/run
                - name: docker-graph
                  mountPath: /var/lib/docker
              # Gate the main container on the daemon actually being up.
              startupProbe:
                exec:
                  command: ["test", "-S", "/var/run/docker.sock"]
                periodSeconds: 2
                failureThreshold: 30
              resources:
                {{- toYaml .Values.docker.dind.resources | nindent 16 }}
            {{- end }}

          containers:
            - name: vuln-agent
              image: {{ include "vuln-agent.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}

              # Discovery mode — whitelist if targetNamespaces is set.
              args:
                - "--discover"
                {{- with include "vuln-agent.targetNamespaces" . }}
                {{- if . }}
                - "--namespaces"
                - {{ . | quote }}
                {{- end }}
                {{- end }}

              # ── Config from ConfigMap ─────────────────────────────────────
              envFrom:
                - configMapRef:
                    name: {{ include "vuln-agent.fullname" . }}

              # ── API keys from Secret ──────────────────────────────────────
              env:
                - name: ANTHROPIC_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.anthropic.existingSecret | default (include "vuln-agent.secretName" .) }}
                      key: {{ .Values.anthropic.existingSecretKey }}
                      optional: true

                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.github.existingSecret | default (include "vuln-agent.secretName" .) }}
                      key: {{ .Values.github.existingSecretKey }}
                      optional: true

                - name: GITOPS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.gitops.existingSecret | default (include "vuln-agent.secretName" .) }}
                      key: {{ .Values.gitops.existingSecretKey }}
                      optional: true

                - name: REPORTS_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.reports.existingSecret | default (include "vuln-agent.secretName" .) }}
                      key: {{ .Values.reports.existingSecretKey }}
                      optional: true

                {{- with .Values.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}

              # ── Volume mounts ─────────────────────────────────────────────
              volumeMounts:
                # Scan results, reports, patch Dockerfiles
                - name: output
                  mountPath: /app/output

                # Trivy vulnerability DB cache
                - name: trivy-cache
                  mountPath: /trivy-cache

                {{- if .Values.docker.dind.enabled }}
                # Shared with the dind sidecar — the docker socket lives here.
                # The projected SA token at /var/run/secrets/... is its own
                # deeper mount, so it is not shadowed by this one.
                - name: docker-run
                  mountPath: /var/run
                # Registry credentials for docker push / crane copy — dind
                # starts with an empty credential store every run.
                - name: docker-config
                  mountPath: /home/agent/.docker
                  readOnly: true
                {{- end }}

              resources:
                {{- toYaml .Values.resources | nindent 16 }}

          # ── Volumes ───────────────────────────────────────────────────────
          volumes:
            - name: output
              persistentVolumeClaim:
                claimName: {{ printf "%s-output" (include "vuln-agent.fullname" .) }}

            - name: trivy-cache
              persistentVolumeClaim:
                claimName: {{ printf "%s-trivy-cache" (include "vuln-agent.fullname" .) }}

            {{- if .Values.docker.dind.enabled }}
            - name: docker-run
              emptyDir: {}
            - name: docker-graph
              emptyDir:
                sizeLimit: {{ .Values.docker.dind.storageSize }}
            - name: docker-config
              secret:
                secretName: {{ include "vuln-agent.registrySecretName" . }}
                items:
                  - key: .dockerconfigjson
                    path: config.json
            {{- end }}

          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
