{{- if .Values.rbac.create }}
---
# ClusterRole: read pods and namespaces across the whole cluster
# so the agent can discover every running container image.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vuln-agent.fullname" . }}
  labels:
    {{- include "vuln-agent.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vuln-agent.fullname" . }}
  labels:
    {{- include "vuln-agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vuln-agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "vuln-agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
